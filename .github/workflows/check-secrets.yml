name: Scan for committed credentials

# This repo is public and its root is deployed publicly, so a committed credential is
# exposed twice over. Runs the same scanner as the local pre-commit hook
# (tools/hooks/pre-commit), across tracked files and every blob in history.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so --history sees every commit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tracked files
        run: python3 tools/check-secrets.py
      - name: Every blob in history
        run: python3 tools/check-secrets.py --history
